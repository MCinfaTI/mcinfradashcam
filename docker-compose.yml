services:
  mcinfra-dashcam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcinfra-dashcam
    restart: unless-stopped
    ports:
      # Porta acessível pela VM do Nginx Proxy Manager.
      # Restrinja 8998 no firewall para o IP da VM do NPM sempre que possível.
      - "8998:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
