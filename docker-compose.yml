services:
  mcinfra-dashcam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcinfra-dashcam
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
